<!-- Rescue MD3 — installable app head. Copy into every application shell.
     theme-color is navy in both schemes: the status bar belongs to the brand,
     not to the scheme. Paths assume the assets are served from /assets/pwa/. -->
<link rel="manifest" href="/assets/pwa/manifest.webmanifest">
<meta name="theme-color" content="#06233E">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/pwa/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/pwa/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon-180.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sea Rescue">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
